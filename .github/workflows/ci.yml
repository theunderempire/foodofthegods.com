name: CI

# Husky hooks are client-side and skippable with --no-verify, so this is the
# backstop that actually gates merges.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run lint
        working-directory: api
      # lint-staged only formats staged files, so anything committed with
      # --no-verify drifts unnoticed. Two files had already drifted this way.
      - run: npx prettier --check src test
        working-directory: api
      - run: npm test
        working-directory: api
      # Fails the build on a known-vulnerable runtime dependency. Dev-only
      # advisories are excluded so tooling churn doesn't block merges.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npx prettier --check src
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
